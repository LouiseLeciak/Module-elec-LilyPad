name: Firmware Build
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache AVR toolchain
        uses: actions/cache@v4
        with:
          path: ~/.apt-cache
          key: avr-toolchain-${{ runner.os }}-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            avr-toolchain-${{ runner.os }}-

      - name: Install toolchain
        run: |
          mkdir -p ~/.apt-cache
          sudo apt-get update
          sudo apt-get install -y -o Dir::Cache::Archives="$HOME/.apt-cache" gcc-avr binutils-avr avr-libc make
          sudo rm -f ~/.apt-cache/lock
          sudo rm -rf ~/.apt-cache/partial
          sudo chown -R "$USER" ~/.apt-cache

      - name: Build project
        run: make all

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: avr-firmware
          path: |
            firmware/build/*.hex
            firmware/build/*.bin
          if-no-files-found: error
