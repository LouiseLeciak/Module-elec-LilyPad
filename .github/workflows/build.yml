name: Firmware Build
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache AVR toolchain
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: avr-toolchain-${{ runner.os }}-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            avr-toolchain-${{ runner.os }}-

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-avr binutils-avr avr-libc make

      - name: Build project
        run: make all

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: avr-firmware
          path: |
            build/*.hex
            build/*.bin
          if-no-files-found: error
