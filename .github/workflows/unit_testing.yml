name: Unit Testing
on: [push, pull_request, workflow_dispatch]

jobs:
  buil-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-avr binutils-avr avr-libc make simavr

      # - name: Compile unity lib
      #   run: |
      #     cd unity
      #     mkdir build
      #     cd build
      #     cmake ..
      #     make
      #     mv libunity.a ..

      - name: Compile and run tests
        run: |
          make test
          ./test_runner
